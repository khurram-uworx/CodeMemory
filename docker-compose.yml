volumes:
  pgvector_data:
  cloned_repos:
  grafana_data:
  onnx_models:

services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.3
    ports:
      - "18888:18888"   # Dashboard UI
      - "4317:18889"    # OTLP gRPC endpoint
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codememory
      POSTGRES_PASSWORD: codememory
      POSTGRES_DB: codememory
    # ports:
    #   - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codememory"]
      interval: 5s
      timeout: 5s
      retries: 5

  model-downloader:
    image: alpine:latest
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /models/bge-micro-v2
        if [ ! -f /models/bge-micro-v2/model.onnx ]; then
          wget -q https://huggingface.co/TaylorAI/bge-micro-v2/resolve/main/onnx/model.onnx -O /models/bge-micro-v2/model.onnx
          echo "model.onnx downloaded"
        fi
        if [ ! -f /models/bge-micro-v2/vocab.txt ]; then
          wget -q https://huggingface.co/TaylorAI/bge-micro-v2/resolve/main/vocab.txt -O /models/bge-micro-v2/vocab.txt
          echo "vocab.txt downloaded"
        fi
        echo "Model download complete"
    volumes:
      - onnx_models:/models
    restart: "no"

  codememory:
    build:
      context: .
      dockerfile: src/CodeMemory.AspNet/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - cloned_repos:/data/cloned-repos
      - onnx_models:/app/models
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PgVector: Host=postgres;Port=5432;Database=codememory;Username=codememory;Password=codememory
      Storage__Provider: pgvector
      RepoRegistry__CloneBasePath: /data/cloned-repos
      ConnectionStrings__Npgsql: Host=postgres;Port=5432;Database=codememory;Username=codememory;Password=codememory
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: codememory-aspnet
      Embedding__Provider: onnx
      Embedding__OnnxIntraOpThreads: "2"
      Embedding__OnnxInferenceBatchSize: "64"
    depends_on:
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
      model-downloader:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - codememory

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: codememory
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
