volumes:
  pgvector_data:
  cloned_repos:

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codememory
      POSTGRES_PASSWORD: codememory
      POSTGRES_DB: codememory
    # ports:
    #   - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codememory"]
      interval: 5s
      timeout: 5s
      retries: 5

  codememory:
    build:
      context: .
      dockerfile: src/CodeMemory.AspNet/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__Provider: pgvector
      ConnectionStrings__PgVector: Host=postgres;Port=5432;Database=codememory;Username=codememory;Password=codememory
      RepoRegistry__Provider: postgresql
      RepoRegistry__CloneBasePath: /data/cloned-repos
      ConnectionStrings__Npgsql: Host=postgres;Port=5432;Database=codememory;Username=codememory;Password=codememory
    volumes:
      - cloned_repos:/data/cloned-repos
    depends_on:
      postgres:
        condition: service_healthy
