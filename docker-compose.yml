volumes:
  pgvector_data:
  cloned_repos:

services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.3
    ports:
      - "18888:18888"   # Dashboard UI
      - "4317:18889"    # OTLP gRPC endpoint
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codememory
      POSTGRES_PASSWORD: codememory
      POSTGRES_DB: codememory
    # ports:
    #   - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codememory"]
      interval: 5s
      timeout: 5s
      retries: 5

  codememory:
    build:
      context: .
      dockerfile: src/CodeMemory.AspNet/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PgVector: Host=postgres;Port=5432;Database=codememory;Username=codememory;Password=codememory
      Storage__Provider: pgvector
      RepoRegistry__CloneBasePath: /data/cloned-repos
      ConnectionStrings__Npgsql: Host=postgres;Port=5432;Database=codememory;Username=codememory;Password=codememory
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: codememory-aspnet
    volumes:
      - cloned_repos:/data/cloned-repos
    depends_on:
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
